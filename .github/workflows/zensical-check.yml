name: Zensical trial build

# Trial build only: proves the project builds under Zensical. Does not deploy.
on:
  push:
    branches: [zensical-test]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-zensical.txt
      - name: Install Zensical
        run: pip install -r requirements-zensical.txt
      - name: Build (default theme)
        run: zensical build
      - name: Build (classic Material look)
        run: zensical build -f mkdocs.classic.yml
      - uses: actions/upload-artifact@v4
        with:
          name: zensical-site
          path: site/
